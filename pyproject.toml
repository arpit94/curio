[project]
name = "curio"
version = "0.1.0"
description = "Daily personal content digest agent using Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "httpx>=0.27",
    "feedparser>=6.0",
    "arxiv>=2.1",
    "rapidfuzz>=3.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curio"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]

[project.scripts]
curio = "curio.agent:main"
